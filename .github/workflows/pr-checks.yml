name: PR checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          for file in site/*.js scripts/*.mjs; do
            node --check "$file"
          done

      - name: Build static site
        run: npm run build
