name: PR checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          for file in site/*.js scripts/*.mjs workers/maze-counter/src/*.js workers/spcx-signer/src/*.js; do
            node --check "$file"
          done

      - name: Test maze leaderboard validation
        run: npm test

      - name: Build static site
        run: npm run build
