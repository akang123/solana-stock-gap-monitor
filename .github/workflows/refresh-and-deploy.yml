name: Refresh and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh market data
        env:
          DEX_TOKEN_BATCH_SIZE: 1
        run: npm run refresh

      - name: Repair published monitor markup
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const path = "site/index.html";
          let html = await readFile(path, "utf8");
          html = html
            .replace("How it works <span aria-hidden=\"true\">↓</span>", "How it works <span aria-hidden=\"true\">→</span>")
            .replace("MARKET PULSQL�span>", "MARKET PULSE</span>")
            .replace("<div><strong id=\"hero-volume\">—</strong><span>24h volume</span></div>\n          </div>\n        </aside>\n      </section>", "<div><strong id=\"hero-volume\">—</strong><span>24h volume</span></div>\n            </div>\n          </aside>\n        </section>")
            .replace("<span aria-hidden=\"true\">•</span> Refresh data", "<span aria-hidden=\"true\">↻</span> Refresh data")
            .replace("eyebrow eyebrow-dark\">IVE COMPARISON", "eyebrow eyebrow-dark\">LIVE COMPARISON");
          await writeFile(path, html);
          NODE

      - name: Build static site
        run: node scripts/build.mjs

      - name: Run freshness and shape checks
        env:
          MAX_SNAPSHOT_AGE_HOURS: 26
        run: npm run check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: refresh-build-check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
